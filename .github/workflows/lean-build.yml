name: Lean build

# Build all Lean libraries and run the linter.

on:
  push:
    branches: [ '**' ]
    paths: &paths
      - 'curve25519-dalek/lean/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean-build.yml'
  pull_request:
    branches: [ '**' ]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: true
          # Strict: warnings are errors.
          build-args: --wfail

      # One step per library: `runLinter` stops at the first failing module.
      - name: Lint Subtle
        if: ${{ !cancelled() }}
        run: lake exe runLinter Subtle
      - name: Lint Zeroize
        if: ${{ !cancelled() }}
        run: lake exe runLinter Zeroize
      - name: Lint EllipticCurve
        if: ${{ !cancelled() }}
        run: lake exe runLinter EllipticCurve
      - name: Lint Curve25519
        if: ${{ !cancelled() }}
        run: lake exe runLinter Curve25519
      - name: Lint Defs
        if: ${{ !cancelled() }}
        run: lake exe runLinter Defs
      - name: Lint Specs
        if: ${{ !cancelled() }}
        run: lake exe runLinter Specs
      - name: Lint Proofs
        if: ${{ !cancelled() }}
        run: lake exe runLinter Proofs
