name = "curve25519-dalek"
version = "0.1.0"
keywords = ["formal verification"]
defaultTargets = ["Curve25519Dalek", "Subtle", "Zeroize", "EllipticCurve", "Curve25519", "Defs", "Specs", "Proofs"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxRecDepth = 10000

# The pinned Aeneas version. Also read by `scripts/aeneas-install.sh` to download
# the charon/aeneas binaries from the GitHub. The `rev` must be a GitHub release tag.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
subDir = "backends/lean"
rev = "nightly-2026.10.23-fdebf20"

# Hand-written library for the `subtle` crate.
[[lean_lib]]
name = "Subtle"
srcDir = "."

# Hand-written library for the `zeroize` crate.
[[lean_lib]]
name = "Zeroize"
srcDir = "."

# Aeneas-generated Lean translation.
[[lean_lib]]
name = "Curve25519Dalek"
srcDir = "curve25519-dalek/lean"

# Elliptic-curve models over a field, independent of any curve.
[[lean_lib]]
name = "EllipticCurve"
srcDir = "."

# Curve25519 in general (parameters, later the curve models), independent of dalek.
[[lean_lib]]
name = "Curve25519"
srcDir = "."

# Definitions needed to state the specs (audited). See curve25519-dalek/lean/README.md.
[[lean_lib]]
name = "Defs"
srcDir = "curve25519-dalek/lean"
globs = ["Defs.*"]

# Spec summaries, one per Rust file (audited). See curve25519-dalek/lean/README.md.
[[lean_lib]]
name = "Specs"
srcDir = "curve25519-dalek/lean"
globs = ["Specs.*"]

# Proofs, one file per Rust item, and the helper theorems they use. See curve25519-dalek/lean/README.md.
[[lean_lib]]
name = "Proofs"
srcDir = "curve25519-dalek/lean"
globs = ["Proofs.*"]
